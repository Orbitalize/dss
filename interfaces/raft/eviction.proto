syntax = "proto3";

package models;

import "google/protobuf/duration.proto";

option go_package = "github.com/interuss/dss/pkg/pb";

// EvictionParameters contains the cleanup parameters for an entity type.
// An entity type is cleaned up only when its parameters are set.
message EvictionParameters {
    // Entities are expired when they ended at least ttl before the proposal timestamp.
    google.protobuf.Duration ttl = 1;
    // Maximum number of entities evicted, 0 means unlimited.
    int64 limit = 2;
}

// EvictionParametersUpdate changes the stored eviction parameters of an entity type.
// An unset update leaves them unchanged.
message EvictionParametersUpdate {
    oneof change {
        // Enables the entity type, or replaces its TTL and limit.
        EvictionParameters parameters = 1;
        // Disables the entity type when true.
        bool disable = 2;
    }
}
